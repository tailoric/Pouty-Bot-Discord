[project]
name = "pouty-bot-discord"
version = "0.1.0"
description = "Discord Bot"
readme = "README.md"
authors = [
    { name = "Eric Schneider" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.26.0",
    "beautifulsoup4>=4.10.0",
    "discord-ext-menus",
    "discord.py",
    "emojipedia>=0.4.1",
    "httpx>=0.24.1",
    "jishaku>=2.5.1",
    "lavalink>=5.2.0",
    "lxml>=4.9.3",
    "matplotlib>=3.5.1",
    "pillow>=10.2.0",
    "pynacl>=1.5.0",
    "python-levenshtein>=0.12.2",
    "thefuzz>=0.19.0",
    "wordcloud>=1.9.3",
    "yt-dlp",
]

[tool.uv.sources]
discord-ext-menus = { git = "https://github.com/Rapptz/discord-ext-menus" }
"discord.py" = { git = "https://github.com/Rapptz/discord.py", rev = "cb3ea9b889dcdefa5aa81b1dc7ce4e3e87abeeb0" }
